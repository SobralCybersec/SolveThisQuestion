[package]
name = "screen-agent"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
futures-util = "0.3"
glib = "0.18"
notify-rust = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.3.2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
xcap = "0.9.8"

# Direct wlr-screencopy so Wayland captures skip xcap's D-Bus screenshot
# probes (gnome-shell / portal) — the interfaces capture-detectors watch.
# Same fork xcap already compiles, so no new transitive deps.
[target.'cfg(target_os = "linux")'.dependencies]
libwayshot-xcap = "0.3.3"
# libwayshot-xcap's bundled image build has no PNG encoder; encode with our own.
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = "thin"
codegen-units = 1
