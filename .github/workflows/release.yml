# ============================================================
# Release — on a semver tag (vX.Y.Z / vX.Y.Z-rcN), build real
# installers with tauri-action and publish a GitHub Release.
#   Linux   (ubuntu-24.04)  → .deb + .AppImage
#   Windows (windows-latest) → NSIS -setup.exe + .msi
# The release is created as a DRAFT so you can eyeball the artifacts
# before making it public. -rc tags are marked pre-release.
# ============================================================
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"

permissions:
  contents: write # tauri-action creates the GitHub Release

jobs:
  release:
    name: Build installers — ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates clang libclang-dev \
            libayatana-appindicator3-dev libdbus-1-dev libgbm-dev libglib2.0-dev \
            libgtk-3-dev libpipewire-0.3-dev librsvg2-dev libssl-dev \
            libwayland-dev libwebkit2gtk-4.1-dev \
            libx11-dev libxcursor-dev libxdo-dev libxi-dev \
            libxinerama-dev libxrandr-dev pkg-config patchelf file

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.15.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: . -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ponytail: pinned to the long-standing @v0 major. Confirm the current
      # tauri-action major before your first tagged release and bump if needed.
      - name: Build + publish release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "RustProxyHub ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
