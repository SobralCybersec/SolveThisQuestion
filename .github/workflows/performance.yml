# ============================================================
# Performance — weekly (and on-demand) build-cost tracking.
# Not a hard gate: it records numbers to the job summary so a
# regression in build time or artifact size is visible over runs.
#   frontend  — vite build time + dist/ size
#   rust      — release compile time + stripped binary size
# ============================================================
name: Performance

on:
  schedule:
    - cron: "0 4 * * 1" # Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cost:
    name: Build time + artifact size
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates clang libclang-dev \
            libayatana-appindicator3-dev libdbus-1-dev libgbm-dev libglib2.0-dev \
            libgtk-3-dev libpipewire-0.3-dev librsvg2-dev libssl-dev \
            libwayland-dev libwebkit2gtk-4.1-dev \
            libx11-dev libxcursor-dev libxdo-dev libxi-dev \
            libxinerama-dev libxrandr-dev pkg-config patchelf file

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.15.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: . -> target

      - run: pnpm install --frozen-lockfile

      - name: Frontend build cost
        run: |
          start=$(date +%s)
          pnpm build
          end=$(date +%s)
          size=$(du -sh frontend/dist 2>/dev/null | cut -f1)
          {
            echo "## Frontend (vite)"
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Build time | $(( end - start )) s |"
            echo "| dist/ size | ${size:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rust release build cost
        run: |
          start=$(date +%s)
          cargo build --release
          end=$(date +%s)
          bin=$(find target/release -maxdepth 1 -type f -executable ! -name '*.d' -name 'screen-agent' | head -1)
          binsize=$( [ -n "$bin" ] && du -h "$bin" | cut -f1 || echo n/a )
          {
            echo "## Rust (release)"
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Compile time | $(( end - start )) s |"
            echo "| Binary | \`$(basename "${bin:-none}")\` — ${binsize} |"
          } >> "$GITHUB_STEP_SUMMARY"
